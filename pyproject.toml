[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hsp"
version = "0.1.0"
description = "Minimal PyTorch VAE baseline for HSP."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "torch>=2.0",
    "torchvision>=0.29.1",
]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
